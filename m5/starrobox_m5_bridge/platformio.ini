; Two separate modes, pick one environment:
;   pio run -e mqtt -t upload   PC -> MQTT -> M5 -> Nexus
;   pio run -e ble  -t upload   phone -> BLE -> M5 -> Nexus
[env]
platform = espressif32@6.9.0
board = m5stack-core-esp32
framework = arduino
monitor_speed = 115200
lib_deps = m5stack/M5Stack

[env:mqtt]
build_flags = -DMODE_MQTT
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient

[env:ble]
build_flags = -DMODE_BLE
