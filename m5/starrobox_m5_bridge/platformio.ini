; M5 AtomS3 + Atomic RS485 Base. Two separate modes, pick one environment:
;   pio run -e mqtt -t upload   PC -> MQTT -> M5 -> Nexus
;   pio run -e ble  -t upload   phone -> BLE -> M5 -> Nexus
; Board settings follow design/m5/M5Atom (the AtomS3 reference project).
[env]
platform = espressif32@6.4.0
board = m5stack-atoms3
framework = arduino
upload_speed = 115200
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified@0.2.11
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DM5ATOMS3

[env:mqtt]
build_flags =
    ${env.build_flags}
    -DMODE_MQTT
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient@2.8

[env:ble]
build_flags =
    ${env.build_flags}
    -DMODE_BLE

; Same as mqtt, plus raw RS485 receive bytes published to <status>/rx for wiring debug.
[env:mqtt-debug]
build_flags =
    ${env:mqtt.build_flags}
    -DDEBUG_BUS
lib_deps =
    ${env:mqtt.lib_deps}
